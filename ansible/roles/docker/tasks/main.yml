---
# tasks file for roles/docker

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install deps for Docker repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true

- name: Add Docker APT repository (Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    filename: docker
    state: present

- name: Update APT cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Add user to docker group
  ansible.builtin.user:
    name: marcus
    groups: docker
    append: true

- name: Copy docker-compose.yml to project
  ansible.builtin.copy:
    src: ../files/docker-compose.yml
    dest: /home/runner/docker/docker-compose.yml
    owner: runner
    group: runner
    mode: '0644'

- name: Docker compose up -d
  community.docker.docker_compose_v2:
    project_src: /path/to/your/compose/dir
    state: present
    detach: true
